    <!-- Prevent theme flash -->
    <script>
      (function () {
        var theme = localStorage.getItem('prayuddha-theme') || 'system';
        var resolved =
          theme === 'system'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : theme;
        document.documentElement.setAttribute('data-theme', resolved);
      })();
